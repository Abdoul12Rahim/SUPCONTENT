version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: supcontent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: supcontent
    volumes:
      - mongo-data:/data/db
    networks:
      - supcontent-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supcontent-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/supcontent
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRE: 7d
      SESSION_SECRET: ${SESSION_SECRET:-change_this_session_secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: http://localhost:5000/api/auth/github/callback
      RAWG_API_KEY: ${RAWG_API_KEY}
      RAWG_API_URL: https://api.rawg.io/api
      WEB_CLIENT_URL: http://localhost:3000
      MOBILE_CLIENT_URL: http://localhost:19006
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - supcontent-network

  # Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: supcontent-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - supcontent-network

volumes:
  mongo-data:
    driver: local

networks:
  supcontent-network:
    driver: bridge
